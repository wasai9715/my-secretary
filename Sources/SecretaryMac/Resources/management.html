function render(){const list=sorted();if(!list.some(x=>x.id===selected))selected=list[0]?.id??null;$('heading').textContent=focus?'这次提醒的事':'事项工作台';document.querySelectorAll('.c-tabs button').forEach(b=>{const active=b.dataset.filter===filter;b.textContent=(b.dataset.filter==='open'?'待处理 ':'历史 ')+items.filter(x=>(focus===null||focus.includes(x.id))&&(b.dataset.filter==='open'?x.status==='open':x.status!=='open')).length;b.classList.toggle('chosen',active);b.setAttribute('aria-pressed',String(active))});$('c-notices').innerHTML=`${focus?'<div class="c-alert"><button class="btn small" id="show-all">查看全部</button> · 仅显示这次提醒的事项</div>':''}${!permission?'<div class="c-alert">通知未开启：到期事项不会弹出提醒 <button class="btn small" id="permission">打开通知设置</button></div>':''}${message?`<div class="c-alert error">${esc(message)}</div>`:''}`;$('show-all')?.addEventListener('click',()=>send('all'));$('permission')?.addEventListener('click',()=>send('permission'));$('c-undo').innerHTML=undo?`<div class="c-undo">${undo.status==='completed'?'已完成':'已取消'} <button id="undo-button">撤销</button></div>`:'';$('undo-button')?.addEventListener('click',()=>send('undo',{id:undo.id}));$('c-rows').innerHTML=list.length?list.map(item=>{const [label,tone]=status(item);return `<button type="button" class="c-line ${selected===item.id?'selected':''}" data-item="${esc(item.id)}" aria-pressed="${selected===item.id}"><strong>${esc(item.title)}</strong><span class="c-date ${!item.reminder&&item.status==='open'?'due':item.status!=='open'?'muted':''}">${item.status==='open'?esc(short(item.reminder)):'不再提醒'}</span><span class="c-date ${overdue(item)&&item.status==='open'?'due':!item.deadline&&!item.deadlineDay?'muted':''}">${esc(deadlineText(item))}</span><span class="badge ${tone}">${label}</span></button>`}).join(''):'<p class="c-empty">这里暂无事项。切换筛选或记下一件事试试。</p>';$('c-rows').querySelectorAll('.c-line').forEach(row=>row.onclick=()=>{selected=row.dataset.item;mode=null;snoozeOpen=false;$('c-modal-layer').replaceChildren();render()});renderDetail()}
function renderDetail(){const item=items.find(x=>x.id===selected);if(!item){$('c-detail').innerHTML='<h2>暂无事项</h2><p>选择一条事项，或记下一件新事。</p>';return}const [label,tone]=status(item);const actions=item.status!=='open'?`<button type="button" class="btn soft" data-action="${item.split?'edit':'restore'}">${item.split?'核对单件事并恢复':'恢复事项'}</button>`:`<button type="button" class="btn primary" data-action="complete">✓ 完成</button>${item.split?'':`<button type="button" class="btn" data-action="snooze">${rank(item)<=2?'稍后提醒':'调整提醒'}</button>`}<button type="button" class="btn" data-action="edit">${item.split?'核对原话':'编辑'}</button><button type="button" class="btn danger" data-action="cancel">取消事项</button>`;$('c-detail').innerHTML=`<div class="eyebrow">选中事项 · 详情预览</div><h2>${esc(item.title)}</h2><p>原话：${esc(item.original)}</p>${item.text!==item.original?`<p>当前内容：${esc(item.text)}</p>`:''}<div class="c-field"><span>明确截止</span><strong class="${overdue(item)&&item.status==='open'?'deadline':''}">${esc(item.deadline?full(item.deadline):item.deadlineDay?dayText(item.deadlineDay)+' · 未指定时间':item.period?deadlineText(item):'没有明确截止')}</strong></div><div class="c-field"><span>下次提醒</span><strong>${item.status!=='open'?'已结束 · 不再提醒':item.reminder?esc(full(item.reminder)):'尚未安排'}</strong></div><div class="c-field"><span>当前状态</span><span class="badge ${tone}">${label}</span></div>${item.split?'<p class="c-inline-warning">包含多个行动，请分别录入或核对为单件事。</p>':''}<div class="controls">${actions}<div id="c-snooze-host"></div></div>${item.suggestion?`<div class="c-field"><span>建议完成</span><strong>${esc(full(item.suggestion))}</strong></div>`:''}${item.failure||item.split?`<details class="c-more"><summary>识别说明</summary>${item.failure?`<p>${esc(item.failure)}</p>`:''}${item.split?'<p>原话已保留。分开录入后可取消原记录；也可编辑并确认单件事。</p><button type="button" class="btn small" data-action="copy">复制原话</button>':''}</details>`:''}<div id="c-form-host"></div>`;$('c-detail').querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>act(button.dataset.action));if(mode==='restore')renderRestore(item);if(snoozeOpen)renderSnooze(item)}
function act(action){const item=items.find(x=>x.id===selected);if(!item)return;if(action==='complete'||action==='cancel')send(action,{id:item.id});else if(action==='copy')send('copy',{id:item.id});else if(action==='snooze'){snoozeOpen=!snoozeOpen;mode=null;renderDetail()}else if(action==='restore'){snoozeOpen=false;mode='restore';renderDetail()}else if(action==='edit'){snoozeOpen=false;mode='edit';renderEdit(item)}}
const future=value=>value&&date(value)>new Date()?'':'请选择将来的提醒时间。';
function choose(item,value,action,feedback){const error=future(value);if(error){feedback.textContent=error;return}send(action,{id:item.id,reminder:value})}
function positionSnooze(pop){const anchor=$('c-detail').querySelector('[data-action="snooze"]');if(!anchor)return;const rect=anchor.getBoundingClientRect(),width=pop.offsetWidth;let top=rect.top-pop.offsetHeight-10;const below=top<8;if(below)top=rect.bottom+10;pop.classList.toggle('below',below);pop.style.top=Math.max(8,Math.min(top,innerHeight-pop.offsetHeight-8))+'px';pop.style.left=Math.max(8,Math.min(rect.left,innerWidth-width-8))+'px'}
function renderSnooze(item){const host=$('c-snooze-host');host.innerHTML=`<div class="c-snooze-popover" role="group" aria-label="调整提醒"><h3>${rank(item)<=2?'推迟到什么时候？':'调整到什么时候？'}</h3><p>从现在起算</p><div class="quick"></div><div class="custom"><button type="button" class="custom-toggle" aria-expanded="false">选择日期和时间 ↓</button><div class="custom-fields" hidden><label>新的提醒时间<input type="datetime-local"></label><p class="c-inline-warning" role="status" data-late-warning></p><button type="button" class="btn primary small" data-custom>设为这个时间</button></div></div><div class="c-snooze-feedback error" role="alert"></div></div>`;const pop=host.firstElementChild,feedback=pop.querySelector('.c-snooze-feedback'),quick=pop.querySelector('.quick');const values=presets.filter(n=>Number.isInteger(n)&&n>0&&n<=1440);for(const n of values.length?values:[15,30,60]){const b=document.createElement('button');b.type='button';b.className='btn small';b.textContent=n%60===0?`${n/60} 小时`:`${n} 分钟`;b.onclick=()=>choose(item,local(new Date(Date.now()+n*60000)),'snooze',feedback);quick.append(b)}const latePresets=(values.length?values:[15,30,60]).filter(n=>late(local(new Date(Date.now()+n*60000)),item));if(latePresets.length){const warning=document.createElement('p');warning.className='c-inline-warning';warning.textContent='所示部分提醒时间晚于明确截止日期。';quick.after(warning)}const toggle=pop.querySelector('.custom-toggle'),fields=pop.querySelector('.custom-fields'),input=fields.querySelector('input');input.value=local(new Date(Date.now()+15*60000));toggle.onclick=()=>{fields.hidden=!fields.hidden;toggle.setAttribute('aria-expanded',String(!fields.hidden));toggle.textContent=fields.hidden?'选择日期和时间 ↓':'收起自定义时间 ↑';if(!fields.hidden)input.focus();positionSnooze(pop)};input.oninput=()=>fields.querySelector('[data-late-warning]').textContent=late(input.value,item)?'提醒时间晚于明确截止日期。':'';input.oninput();pop.querySelector('[data-custom]').onclick=()=>choose(item,input.value,'snooze',feedback);positionSnooze(pop)}
function renderRestore(item){const host=$('c-form-host');host.innerHTML='<form class="c-form"><label>恢复后设置下次提醒<input name="reminder" type="datetime-local" required></label><div class="presets"></div><p class="c-inline-warning" role="status"></p><p class="error" role="alert"></p><div class="controls"><button class="btn primary small" type="submit">恢复事项</button><button class="btn small" type="button" data-close>取消</button></div></form>';const input=host.querySelector('input'),hint=host.querySelector('.c-inline-warning'),feedback=host.querySelector('.error');input.value=local(new Date(Date.now()+15*60000));const update=()=>hint.textContent=late(input.value,item)?'提醒时间晚于明确截止日期。':'';input.oninput=update;update();for(const n of presets){const b=document.createElement('button');b.type='button';b.className='btn small';b.textContent=n%60===0?`${n/60} 小时后`:`${n} 分钟后`;b.onclick=()=>{input.value=local(new Date(Date.now()+n*60000));update()};host.querySelector('.presets').append(b)}host.querySelector('[data-close]').onclick=()=>{mode=null;renderDetail()};host.querySelector('form').onsubmit=e=>{e.preventDefault();choose(item,input.value,'restore',feedback)}}
function closeEdit(){mode=null;$('c-modal-layer').replaceChildren();$('c-detail').querySelector('[data-action="edit"]')?.focus()}
function renderEdit(item){const host=$('c-modal-layer'),isDay=!!item.deadlineDay;host.innerHTML=`<div class="c-modal-backdrop"><section class="c-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="c-edit-title"><header><div><div class="eyebrow">事项编辑</div><h2 id="c-edit-title">${item.split?'核对原话':'修改事项'}</h2></div><button type="button" class="close" data-close aria-label="关闭编辑窗口">×</button></header><form class="c-form"><label>事项标题<input name="title" maxlength="80" required value="${esc(item.title)}"></label><label>事项内容<textarea name="text" required>${esc(item.text)}</textarea></label><label>下次提醒<input name="reminder" type="datetime-local" value="${esc(item.split?'':item.reminder||'')}"></label><div class="c-deadline-editor"><label data-deadline-exact ${isDay?'hidden':''}>明确截止<input name="deadlineExact" type="datetime-local" step="60" value="${esc(item.deadline||'')}"></label><label data-deadline-day ${isDay?'':'hidden'}>明确截止日期<input name="deadlineDay" type="date" value="${esc(item.deadlineDay||'')}"></label><div class="deadline-tools"><button type="button" data-toggle-time>${isDay?'改为具体时间':'仅选择日期'}</button><button type="button" data-clear-deadline ${item.deadline||item.deadlineDay||item.period?'':'hidden'}>清除截止</button></div></div>${item.split?'<p class="sample-note">原话包含多个行动时，请分别记下；此处只适用于核对并改成单件事后手动安排。</p><label><input type="checkbox" name="single" style="display:inline;width:auto;margin:0 6px 0 0">我已核对：现在是一件事</label>':''}<p class="c-inline-warning" role="status"></p><p class="error" role="alert"></p><div class="controls"><button class="btn small" type="button" data-close>取消</button><button class="btn primary small" type="submit">保存修改</button></div></form></section></div>`;const form=host.querySelector('form'),exact=form.elements.deadlineExact,day=form.elements.deadlineDay,exactField=host.querySelector('[data-deadline-exact]'),dayField=host.querySelector('[data-deadline-day]'),toggle=host.querySelector('[data-toggle-time]'),clear=host.querySelector('[data-clear-deadline]');let cleared=false;const deadline=()=>exactField.hidden?(day.value||null):(exact.value||null);const update=()=>{clear.hidden=!exact.value&&!day.value&&!item.period;const limit={deadline:exactField.hidden?null:exact.value,deadlineDay:exactField.hidden?day.value:null};host.querySelector('.c-inline-warning').textContent=late(form.elements.reminder.value,limit)?'提醒时间晚于明确截止日期。':''};toggle.onclick=()=>{if(dayField.hidden){day.value=exact.value.slice(0,10)||day.value;exact.value='';dayField.hidden=false;exactField.hidden=true;toggle.textContent='改为具体时间'}else{exact.value='';dayField.hidden=true;exactField.hidden=false;toggle.textContent='仅选择日期'}update()};clear.onclick=()=>{day.value='';exact.value='';cleared=true;clear.hidden=true;update()};form.querySelectorAll('[name="reminder"],[name="deadlineDay"],[name="deadlineExact"]').forEach(field=>field.oninput=update);update();host.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeEdit);host.querySelector('.c-modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeEdit()};form.elements.title.focus();form.onsubmit=e=>{e.preventDefault();const title=form.elements.title.value.trim(),text=form.elements.text.value.trim(),reminder=form.elements.reminder.value;if(!title||!text){host.querySelector('.error').textContent='标题和内容不能为空。';return}if(item.split&&(!form.elements.single.checked||text===item.text||!reminder)){host.querySelector('.error').textContent='请核对为一件事，并设置新的提醒。';return}if(reminder&&reminder!==item.reminder&&future(reminder)){host.querySelector('.error').textContent=future(reminder);return}send('edit',{id:item.id,title,text,reminder,deadline:deadline(),clearPeriod:cleared||!!deadline()||(!item.period),single:!!form.elements.single?.checked})}}
window.managementState=state=>{items=state.items;focus=state.focus;permission=state.permission;message=state.message||'';presets=state.presets||[15,30,60];if(state.reset){filter='open';selected=null;mode=null;snoozeOpen=false;$('c-modal-layer').replaceChildren();undo=null}if(mode==='edit'&&!items.some(x=>x.id===selected)){mode=null;$('c-modal-layer').replaceChildren()}render()};
window.managementResult=result=>{if(result.error){const target=$('c-modal-layer').querySelector('.error')||$('c-detail').querySelector('.error');if(target)target.textContent=result.error;else{message=result.error;render()}return}if(result.undo){undo=result.undo;clearTimeout(undoTimer);undoTimer=setTimeout(()=>{undo=null;render()},7000)}else if(result.action==='undo'){selected=undo?.id??selected;filter='open';undo=null;clearTimeout(undoTimer)}if(result.action==='restore'||result.action==='edit'){filter='open'}mode=null;snoozeOpen=false;$('c-modal-layer').replaceChildren();render()};
$('c-add').onclick=()=>send('add');$('c-detail').addEventListener('scroll',()=>{if(snoozeOpen){snoozeOpen=false;renderDetail()}});window.addEventListener('resize',()=>{const pop=document.querySelector('.c-snooze-popover');if(pop)positionSnooze(pop)});document.querySelectorAll('.c-tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;mode=null;snoozeOpen=false;$('c-modal-layer').replaceChildren();render()});document.addEventListener('click',e=>{if(snoozeOpen&&!e.target.closest('.c-snooze-popover,[data-action="snooze"]')){snoozeOpen=false;renderDetail()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='edit'){closeEdit();e.preventDefault()}else if(e.key==='Escape'&&(snoozeOpen||mode==='restore')){snoozeOpen=false;mode=null;renderDetail();e.preventDefault()}});send('ready');setInterval(()=>{if(!mode&&!snoozeOpen)render()},60000);
})();
</script></body></html>
