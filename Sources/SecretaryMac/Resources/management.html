function render(){if(pendingSelection){const target=items.find(x=>x.id===pendingSelection);if(target){selected=target.id;filter=bucket(target)}}const list=sorted();if(!list.some(x=>x.id===selected))selected=list[0]?.id??null;document.querySelectorAll('.c-tabs button').forEach(b=>{const active=b.dataset.filter===filter;b.textContent=({current:'当前待处理 ',later:'稍后 ',attention:'待识别 ',history:'历史 '}[b.dataset.filter])+items.filter(x=>(focus===null||focus.includes(x.id))&&bucket(x)===b.dataset.filter).length;b.classList.toggle('chosen',active);b.setAttribute('aria-pressed',String(active))});$('c-clear-history').hidden=filter!=='history'||!items.some(x=>x.status!=='open');$('c-notices').innerHTML=`${focus?'<div class="c-alert"><button class="btn small" id="show-all">查看全部</button> · 仅显示这次提醒的事项</div>':''}${!permission?'<div class="c-alert">通知未开启：到期事项不会弹出提醒 <button class="btn small" id="permission">打开通知设置</button></div>':''}${message?`<div class="c-alert error">${esc(message)}</div>`:''}`;$('show-all')?.addEventListener('click',()=>send('all'));$('permission')?.addEventListener('click',()=>send('permission'));$('c-undo').innerHTML=undo?`<div class="c-undo">${undo.status==='completed'?'已完成':'已取消'} <button id="undo-button">撤销</button></div>`:'';$('undo-button')?.addEventListener('click',()=>send('undo',{id:undo.id}));$('c-rows').innerHTML=list.length?list.map(item=>{const [label,tone]=status(item);return `<button type="button" class="c-line ${selected===item.id?'selected':''}" data-item="${esc(item.id)}" aria-pressed="${selected===item.id}"><strong>${esc(item.title)}</strong><span class="c-date ${!item.reminder&&item.status==='open'?'due':item.status!=='open'?'muted':''}">${item.status==='open'?item.recognition==='ready'&&!item.reminder&&item.firstReminder?'本轮已结束':esc(short(item.reminder)):'不再提醒'}</span><span class="c-date ${overdue(item)&&item.status==='open'?'due':!item.deadline&&!item.deadlineDay?'muted':''}">${esc(deadlineText(item))}</span><span class="badge ${tone}">${labe function renderDetail(){const item=items.find(x=>x.id===selected);if(!item){$('c-detail').innerHTML='<h2>暂无事项</h2><p>选择一条事项，或记下一件新事。</p>';return}const [label,tone]=status(item);const actions=item.status!=='open'?`<button type="button" class="btn soft" data-action="${item.split?'edit':'restore'}">${item.split?'核对单件事并恢复':'恢复事项'}</button>`:`<button type="button" class="btn primary" data-action="complete">✓ 完成</button>${item.split?'':`<button type="button" class="btn" data-action="snooze">${rank(item)<=2?'稍后提醒':'调整提醒'}</button>`}<button type="button" class="btn" data-action="edit">${item.split?'核对原话':'编辑'}</button><button type="button" class="btn danger" data-action="cancel">取消事项</button>`;$('c-detail').innerHTML=`<h2>${esc(item.title)}</h2>${savedNote?.id===item.id?`<p class="c-saved-note" role="status">${esc(savedNote.text)}</p>`:''}<p>原话：${esc(item.original)}</p>${item.initialCapture&&item.initialCapture!==item.original?`<p>最初录入：${esc(item.initialCapture)}</p>`:''}${item.text!==item.original?`<p>当前内容：${esc(item.text)}</p>`:''}<div class="c-field"><span>明确截止</span><strong class="${overdue(item)&&item.status==='open'?'deadline':''}">${esc(item.deadline?full(item.deadline):item.deadlineDay?dayText(item.deadlineDay)+' · 未指定时间':item.period?deadlineText(item):'没有明确截止')}</strong></div>${item.timeUnchangedAfterContentEdit?'<p class="c-inline-warning">内容已修改，提醒时间未变。请检查时间，使用「调整提醒」修改。</p>':''}<div class="c-field"><span>下次提醒</span><strong>${item.status!=='open'?'已结束 · 不再提醒':item.reminder?esc(full(item.reminder)):item.recognition==='ready'&&item.firstReminder?'本轮提醒已结束':'尚未安排'}</strong></div><div class="c-field"><span>提醒时间来源</span><strong>${esc(({explicit:'原话明确提及',inferred:'模型建议',default_15min:'无时间线索，默认 15 分钟',uncertain:'待确认'})[item.reminderSource]||'手动设置／未识别')}</strong>${item.timeEvidence?.length?`<p>依据：${esc(item.timeEvidence.join('；'))}</p>`:''}</div><div class="c-field"><span>当前状态</span><span class="badge ${tone}">${label}</span></div>${item.split?'<p class="c-inline-warning">包 function act(action){const item=items.find(x=>x.id===selected);if(!item)return;if(action==='complete'||action==='cancel')send(action,{id:item.id});else if(action==='copy')send('copy',{id:item.id});else if(action==='retry')send('retry',{id:item.id});else if(action==='snooze'){snoozeOpen=!snoozeOpen;mode=null;renderDetail()}else if(action==='restore'){snoozeOpen=false;mode='restore';renderDetail()}else if(action==='edit'){snoozeOpen=false;mode='edit';renderEdit(item)}}
const future=value=>value&&date(value)>new Date()?'':'请选择将来的提醒时间。';
function presetTime(rule){if(rule.rule==='duration')return new Date(Date.now()+rule.minutes*60000);if(rule.rule==='relativeDayTime'){const now=new Date(),day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+rule.dayOffset,rule.hour,rule.minute);if(day.getHours()===rule.hour&&day.getMinutes()===rule.minute)return day}return null}

function positionSnooze(pop){const anchor=$('c-detail').querySelector('[data-action="snooze"]');if(!anchor)return;const rect=anchor.getBoundingClientRect(),width=pop.offsetWidth;let top=rect.top-pop.offsetHeight-10;const below=top<8;if(below)top=rect.bottom+10;pop.classList.toggle('below',below);pop.style.top=Math.max(8,Math.min(top,innerHeight-pop.offsetHeight-8))+'px';pop.style.left=Math.max(8,Math.min(rect.left,innerWidth-width-8))+'px'}

item)?'提醒时间晚于明确截止日期。':''};input.oninput();pop.querySelector('[data-custom]').onclick=()=>choose(item,input.value,'snooze',feedback);pop.querySelector('#c-reminder-command [name="instruction"]').oninput=()=>{pop.querySelector('#c-reminder-preview').replaceChildren()};pop.querySelector('#c-reminder-command').onsubmit=e=>{e.preventDefault();const instruction=e.currentTarget.elements.instruction.value.trim();if(!instruction)return;pop.querySelector('#c-reminder-preview').textContent='正在解析，尚未调整提醒…';send('previewReminderCommand',{id:item.id,instruction})};positionSnooze(pop)}
function renderRestore(item){const host=$('c-form-host');host.innerHTML='<form class="c-form"><label>恢复后设置下次提醒<input name="reminder" type="datetime-local" step="60" required></label><div class="presets"></div><p class="c-inline-warning" role="status"></p><p class="error" role="alert"></p><div class="controls"><button class="btn primary small" type="submit">恢复事项</button><button class="btn small" type="button" data-close>取消</button></div></form>';const input=host.querySelector('input'),hint=host.querySelector('.c-inline-warning'),feedback=host.querySelector('.error');input.value=local(new Date(Date.now()+15*60000));const update=()=>hint.textContent=late(input.value,item)?'提醒时间晚于明确截止日期。':'';input.oninput=()=>{feedback.textContent='';update()};update();presets.forEach((rule,index)=>{const b=document.createElement('button');b.type='button';b.className='btn small';b.textContent=rule.label;b.onclick=()=>choose(item,null,'restore',feedback,index);host.querySelector('.presets').append(b)});host.querySelector('[data-close]').onclick=()=>{mode=null;renderDetail()};host.querySelector('form').onsubmit=e=>{e.preventDefault();choose(item,input.value,'restore',feedback)}}
function closeEdit(){mode=null;$('c-modal-layer').replaceChildren();$('c-detail').querySelector('[data-action="edit"]')?.focus()}
function renderEdit(item){const host=$('c-modal-layer'),isDay=!!item.deadlineDay;host.innerHTML=`<div class="c-modal-backdrop"><section class="c-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="c-edit-title"><header><div><div class="eyebrow">事项编辑</div><h2 id="c-edit-title">${item.split?'核对原话':'修改事项'}</h2></div><button type="button" class="close" data-close aria-label="关闭编辑窗口">×</button></header><form class="c-form"><label>事项标题<input name="title" maxlength="80" required value="${esc(item.title)}"></label><label>事项内容<textarea name="text" required>${esc(item.text)}</textarea></label><label>下次提醒<input name="reminder" type="datetime-local" step="60" value="${esc(item.split?'':item.reminder||'')}"></label><div class="c-deadline-editor"><label data-deadline-exact ${isDay?'hidden':''}>明确截止<input name="deadlineExact" type="datetime-local" step="60" value="${esc(item.deadline||'')}"></label><label data-deadline-day ${isDay?'':'hidden'}>明确截止日期<input name="deadlineDay" type="date" value="${esc(item.deadlineDay||'')}"></label><div class="deadline-tools"><button type="button" data-toggle-time>${isDay?'改为具体时间':'仅选择日期'}</button><button type="button" data-clear-deadline ${item.deadline||item.deadlineDay||item.period?'':'hidden'}>清除截止</button></div></div>${item.split?'<p class="sample-note">原话包含多个行动时，请分别记下；此处只适用于核对并改成单件事后手动安排。</p><label><input type="checkbox" name="single" style="display:inline;width:auto;margin:0 6px 0 0">我已核对：现在是一件事</label>':''}<p class="c-inline-warning" role="status"></p><label data-override-label hidden><input type="checkbox" name="overrideDeadline" style="display:inline;width:auto;margin:0 6px 0 0">确认提醒晚于明确截止，仍要保存</label><p class="error" role="alert"></p><div class="controls"><button class="btn small" type="button" data-close>取消</button><button class="btn primary small" type="submit">保存修改</button></div></form>${item.status==='open'&&!item.split?'<form id="c-edit-command" class="c-form"><label>或用一句话修改提醒和截止时间<input name="instruction" placeholder="例如： window.managementCommandResult=result=>{const editStatus=$('c-edit-preview');if(result.kind==='previewEdit'){if(!editStatus)return;const parts=[];if(result.reminder)parts.push('提醒改为：'+full(result.reminder));if(result.deadline)parts.push('明确截止改为：'+(result.deadlineKind==='day'?dayText(result.deadline)+'（未指定时分）':full(result.deadline)));editStatus.replaceChildren(document.createTextNode(parts.join('；')+' '));const button=document.createElement('button');button.className='btn primary small';button.textContent='确认修改';button.onclick=()=>{pendingSelection=selected;send('confirmEditPreview',{id:selected})};editStatus.append(button);return}const status=editStatus||$('c-reminder-preview');if(result.kind==='choosePreset'){if(status)status.textContent='时间尚未明确，请直接选择上面的预设。';return}if(result.kind==='preview'){if(!status)return;status.replaceChildren(document.createTextNode('将改为：'+full(result.reminder)+' '));const button=document.createElement('button');button.className='btn primary small';button.textContent='确认调整';button.onclick=()=>{pendingSelection=selected;send('confirmReminderPreview',{id:selected})};status.append(button);return}if(result.kind==='confirmDeadline'){if(!status)return;status.replaceChildren(document.createTextNode('提醒晚于明确截止。 '));const button=document.createElement('button');button.className='btn danger small';button.textContent='仍要推迟';button.onclick=()=>{pendingSelection=selected;send('confirmDeadlineCommand',{id:selected})};status.append(button);return}if(status)status.textContent=result.message||'操作未完成'};
window.managementResult=result=>{if(result.error){pendingSelection=null;const target=$('c-modal-layer').querySelector('.error')||$('c-detail').querySelector('.error');if(target)target.textContent=result.error;else{message=result.error;render()}return}if(result.undo){undo=result.undo;clearTimeout(undoTimer);undoTimer=setTimeout(()=>{undo=null;render()},7000)}else if(result.action==='undo'){selected=undo?.id??selected;filter='current';undo=null;clearTimeout(undoTimer)}if(['snooze','restore','edit','command','confirmReminderPreview','confirmEditPreview','confirmDeadlineCommand'].includes(result.action)){const target=items.find(x=>x.id===(pendingSelection||selected));if(target){selected=target.id;filter=bucket(target);savedNote={id:target.id,text:'已保存，可以在这里核对更新后的提醒和截止时间'};clearTimeout(savedNoteTimer);const savedId=target.id;savedNoteTimer=setTimeout(()=>{if(savedNote?.id===savedId){savedNote=null;render()}},4000)}}pendingSelection=null;mode=null;snoozeOpen=false;$('c-modal-layer').replaceChildren();render()};
$('c-add').onclick=()=>send('add');$('c-clear-history').onclick=()=>send('clearHistory');$('c-detail').addEventListener('scroll',()=>{if(snoozeOpen){snoozeOpen=false;renderDetail()}});window.addEventListener('resize',()=>{const pop=document.querySelector('.c-snooze-popover');if(pop)positionSnooze(pop)});document.querySelectorAll('.c-tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;pendingSelection=null;savedNote=null;clearTimeout(savedNoteTimer);mode=null;snoozeOpen=false;$('c-modal-layer').replaceChildren();render()});document.addEventListener('click',e=>{if(snoozeOpen&&!e.target.closest('.c-snooze-popover,[data-action="snooze"]')){snoozeOpen=false;renderDetail()}});document.addEventListener('keydown',e=>{if(e.key!=='Escape'||e.defaultPrevented)return;if(mode==='edit'){closeEdit()}else if(snoozeOpen||mode==='restore'){snoozeOpen=false;mode=null;renderDetail()}else{send('close')}e.preventDefault()});send('ready');setInterval(()=>{if(!mode&&!snoozeOpen)render()},60000);
