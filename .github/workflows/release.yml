name: Unnotarized preview DMG
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  package:
    name: Package ${{ matrix.arch }} (UNNOTARIZED)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref and architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || exit 1
          [[ "$(uname -m)" == '${{ matrix.arch }}' ]] || { echo 'Runner architecture mismatch'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tag is not on main'; exit 1; }
      - name: Build and package unnotarized preview
        shell: bash
        env:
          APP_VERSION: ${{ github.ref_name }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export APP_VERSION="${APP_VERSION#v}"
          swift run SecretaryCoreChecks
          swift run SecretaryPresetChecks
          swift run SecretaryCommandChecks
          scripts/build-app.sh
          # Window/notification checks require a real logged-in macOS session.
          scripts/package-preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The repository owner must approve before any unnotarized binary is public.
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: release
      - name: Verify hashes and create unnotarized prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          for hash in *.sha256; do sha256sum -c "$hash"; done
          [[ $(find . -maxdepth 1 -name '*-UNNOTARIZED.dmg' | wc -l) -eq 2 ]]
          gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "My Secretary $GITHUB_REF_NAME (未公证预览版 / UNNOTARIZED)" \
            --notes '⚠️ 未经过 Apple Developer ID 签名或 Apple 公证。macOS 可能阻止首次打开；请先确认下载来源可信，尝试启动后到「系统设置 → 隐私与安全性」选择「仍要打开」。早期预览：尚未完成完整 V1 真机验收，请勿依赖其承担重要承诺提醒。需要 macOS 14+、自行提供 DeepSeek API Token，并允许通知。'
